# 시드 기반 스타일 변주 풀 (variation.py가 글마다 부분집합을 뽑아 프롬프트에 주입)
#
# 왜: 전 글이 같은 카오모지 세트·같은 빈도·같은 고정 문구로 수렴하면 블로그 전체
# (나아가 여러 계정)에서 동일 패턴이 반복돼, 네이버 유사문서·스팸 필터가 보는
# '타 문서와 중복된 표현 반복' 신호(기계 지문)가 된다. 여기 풀을 넓게 두고
# 글(시드)마다 5~8개 부분집합·개수 상한을 다르게 배정해 글 간 분산을 만든다.
#
# 주의: 카오모지에 '~'(물결)나 '!'(느낌표)가 든 것은 넣지 말 것 — postprocess의
# 문자 치환이 카오모지를 깨뜨린다. ((๑´~ˋ๑)만 예외적으로 코드에서 보호됨)

kaomoji:
  # 맛·만족·좋은 느낌
  taste:
    - "(๑ᵔ⤙ᵔ๑)"
    - "(๑´~ˋ๑)"
    - "( ˶ˆᗜˆ˵ )"
    - "(˶ᵔ ᵕ ᵔ˶)"
    - "(⸝⸝>ᴗ<⸝⸝)"
    - "(๑˃̵ᴗ˂̵)"
    - "( ᐛ )"
    - "(´ᗜ`)"
  # 파이팅·응원
  cheer:
    - "٩(ˊᗜˋ*)و"
    - "(ง •̀_•́)ง"
    - "(๑و•̀Δ•́)و"
    - "٩( ᐛ )و"
    - "ᕙ( •̀ᗜ•́ )ᕗ"
    - "(๑•̀ㅂ•́)و"
  # 아쉬움·슬픔
  sad:
    - "(｡•́︿•̀｡)"
    - "( ᵕ̩̩ㅅᵕ̩̩ )"
    - "(｡ŏ﹏ŏ)"
    - "(ᐡ •̥ ﻌ •̥ ᐡ)"
    - "( ˃̣̣̥⌓˂̣̣̥ )"
  # 분노·불만
  angry:
    - "٩(๑ˋ^´๑)۶"
    - "(•ˋ _ ˊ•)"
    - "(¬_¬)"
  # 꾸미기·귀여움
  cute:
    - "(｡･ω･｡)o"
    - "ღ'ᴗ'ღ"
    - "(⑅˘꒳˘)"
    - "( ˶ˊᵕˋ˵ )"
    - "₍ᐢ..ᐢ₎"
    - "(=^･ω･^=)"
    - "◝(ᵔᗜᵔ)◜"

# 허용 유행어 풀 — 수명이 긴 표현 위주(갱신일: 2026-07). 글마다 2~4개만 노출된다.
# 형식: 표현 — 뜻 — 예시. 각 항목에 weight: 0~3(안 씀/가끔/보통/자주)을 붙이면
# 후보로 뽑힐 확률 가중치가 된다(미지정 = 1). 웹UI '스타일 풀'에서도 편집 가능.
slang:
  - expr: "찐"
    meaning: "진짜의 강조"
    example: "찐 현지인 맛집"
  - expr: "국룰"
    meaning: "국민 룰, 누구나 인정하는 정석"
    example: "치킨엔 콜라가 국룰"
  - expr: "인생OO"
    meaning: "지금까지 중 최고의 OO"
    example: "인생 라멘 등극"
  - expr: "미쳤다"
    meaning: "감탄의 의미로 긍정적 사용"
    example: "뷰 진짜 미쳤다"
  - expr: "존맛"
    meaning: "정말 맛있다"
    example: "한입 먹자마자 존맛 인정"
  - expr: "최애"
    meaning: "가장 좋아하는 것"
    example: "요즘 최애 카페"
  - expr: "N차"
    meaning: "여러 번 반복(방문·구매)"
    example: "벌써 3차 방문"
  - expr: "OO각"
    meaning: "OO할 분위기·확신"
    example: "이건 재방문각"
  - expr: "꿀조합"
    meaning: "잘 어울리는 조합"
    example: "치즈랑 같이 먹으면 꿀조합"
  - expr: "도장깨기"
    meaning: "목록을 하나씩 정복하기"
    example: "연남동 맛집 도장깨기 중"
  - expr: "가심비"
    meaning: "가격 대비 마음의 만족"
    example: "가심비로는 최고"
  - expr: "입틀막"
    meaning: "말문이 막힐 정도로 놀람"
    example: "비주얼 보고 입틀막"
  - expr: "플렉스"
    meaning: "기분 좋게 큰 소비를 함"
    example: "오늘은 플렉스 해봤어요"
  - expr: "~가되"
    meaning: "'돼'를 일부러 '되'로 틀려 쓰는 강조 — 이게 가능하냐는 감탄"
    example: "돼지가 되"
  - expr: "밤티"
    meaning: "못생겼는데 귀여운 느낌 — '나쁘다'의 순화"
    example: "디자인이 좀 밤티인데 그게 또 매력있긴해요"

# 맛집 글 섹션 흐름 변형(시드로 1개 선택). 재료에 없는 섹션은 건너뛴다는 규칙은 그대로.
# 위치·실용 정보(정보 표)는 항상 첫 섹션 고정 — 검색 유입 독자가 가장 먼저 찾는 정보.
structure_place:
  - "위치·실용 정보 → 외관·분위기 → 메뉴 후기 → 총평 (기본 흐름)"
  - "위치·실용 정보 → 메뉴·맛 이야기 먼저 → 공간·분위기 → 총평"
  - "위치·실용 정보 → 방문 계기와 첫인상 → 메뉴 후기 → 총평"

# 상품 글 섹션 흐름 변형
structure_product:
  - "첫인상·소재 → 차별점 → 활용성·사용감 → (구성품) → 총평 (기본 흐름)"
  - "실사용 장면 먼저 → 첫인상·디자인 → 차별점 → 총평"
  - "구매 고민 포인트 → 사용해 보니 → 디테일·구성 → 총평"

# 핵심 한마디(인용구) 위치
quote_position:
  - "인트로 직후"
  - "마무리 총평 직전"

# 상품 추천 체크리스트 소제목 변형(🌟 뒤에 붙는 문구)
checklist_heading:
  - "이런 분들께 추천해요"
  - "이런 분이라면 만족하실 거예요"
  - "저는 이런 분께 권하고 싶어요"
  - "이런 분들이 쓰면 딱 !"

# 상품 핵심 요약 박스에서 소제목-설명 연결 문자
summary_connector:
  - "—"
  - "·"

# PICK 리스트(여러 곳 소개 글) 전환 멘트 변형 — 그대로 베끼지 말고 상황에 맞게 응용
pick_transition:
  - "아래에서 자세하게 보여드릴게요 .ᐟ"
  - "하나씩 차례로 풀어볼게요 .ᐟ"
  - "그럼 첫 번째 가게부터 가볼게요 〰️"

# 검색 제목 형식(시드로 1개 강제) — 전 글이 "[키워드] …후기"로만 굳으면 목록에서 도배처럼 보인다.
# 대표 키워드를 앞 25자에 그대로 넣는 원칙은 형식과 무관하게 항상 지킨다.
title_format:
  - '대괄호형 "[키워드] 내용 후기" (예: "[혜화맛집] 치즈철판카츠 메종아카이 내돈내산 후기")'
  - '키워드로 시작하는 평서형 (예: "혜화맛집 메종아카이 4시간 웨이팅 뚫은 후기 (치즈철판카츠, 주차)") — 대괄호 없이'
  - '키워드를 앞에 둔 자연스러운 문장형 (예: "대학로데이트 코스로 다녀온 메종아카이 솔직 후기")'
  - '정리·꿀팁형 "키워드 + 핵심수치 + 정리 (아이템 나열)" — 여러 아이템·장소를 다루는 글 전용, 단일 제품·단일 가게 글이면 이 형식 대신 키워드 평서형으로 (예: "몽골여행 준비물 다이소에서 9천원으로 끝내는 꿀팁정리 (마이비데,쿨토시,햇빛차단마스크,소분통)")'

# 제목 훅 유형(시드로 1개 강제) — "가게명+후기"로 밋밋하게 끝내지 말 것. 본문에 실제로 나오는 사실만.
title_hook:
  - '숫자·실측 (예: "4시간 웨이팅", "오픈 10분 만석", "한 달 실사용")'
  - '솔직한 반전 (예: "기대 없이 갔다가", "단점까지 말하는", "반신반의로 샀다가") — 경험 메모에 실제로 그런 반전이 있을 때만. 없으면 예시를 베끼지 말고 숫자·실측 훅으로 대체'
  - '상황·희소 포인트 (예: "혼밥 후기", "주차 걱정 없는", "아기랑 가도 되는" / 상품이면 "한정판", "품절 임박")'
  - '결과 선언 (예: "재방문 한", "찐 단골된", "재구매한", "정착한")'

# 대제목(콘셉트 한 줄) 톤(시드로 1개 강제) — 감성형/유머형을 글마다 번갈아.
concept_tone:
  - '감성형 (예: "요즘 푹 빠진 태고 성지", "겨울마다 생각나는 그 국물")'
  - '유머형 (예: "일주일 내내 이거 생각만 하다 또왔다", "돼지가 되", "지갑이 먼저 열리는 마법") — "~림"·"~임"·"~함" 같은 명사형 종결 금지'

# 인트로 첫 문장 접근(시드로 1개 강제) — 첫 문장이 매번 "안녕하세요 오늘은…"으로 똑같아지지 않게.
intro_opener:
  - "그날의 장면·상황을 한 컷 묘사하며 시작 (예: 비 오던 날, 웨이팅 줄 앞에서…)"
  - "짧은 질문을 던지며 시작 (예: 진짜 이 가격에 이 맛이 가능한걸까 ?)"
  - "솔직한 속마음·고백으로 시작 (예: 사실 별 기대 안 했어요)"
  - "대상(가게·제품)의 첫인상 한마디로 바로 시작 (인사말 없이)"
